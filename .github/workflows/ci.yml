name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly selector canary: catches a ChatGPT/Claude DOM change before users do.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Check version consistency
        run: npm run version:check

      - name: Syntax check every shipped script
        run: |
          for file in $(node -e "
            const m=require('./manifest.json');
            const f=new Set(m.content_scripts[0].js);
            f.add(m.background.service_worker); f.add('pdf-worker.js'); f.add('popup.js'); f.add('options.js');
            console.log([...f].join(' '));
          "); do
            node --check "$file" || exit 1
          done

      - name: Unit and DOM tests
        run: node --test "tests/*.test.js"

      - name: Install Chrome for the offscreen smoke test
        run: npx puppeteer browsers install chrome

      - name: Real-Chrome extension smoke test
        run: xvfb-run -a node --test tests/browser-extension-smoke.mjs

      - name: Build store package
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
