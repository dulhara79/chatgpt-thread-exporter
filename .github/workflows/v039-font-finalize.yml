name: Regenerate V039 PDF fonts

on:
  push:
    branches:
      - fix/pdf-selectable-content-v039

permissions:
  contents: write

jobs:
  bundle-fonts:
    if: ${{ !contains(github.event.head_commit.message, '[v039-fonts-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-selectable-content-v039
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build final self-contained PDF font VFS
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet fonttools brotli
          mkdir -p /tmp/cgx-fonts

          curl -L --fail --retry 3 -o /tmp/cgx-fonts/sans-var.ttf             'https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/cgx-fonts/sinhala-var.ttf             'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssinhala/NotoSansSinhala%5Bwdth%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/cgx-fonts/tamil-var.ttf             'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstamil/NotoSansTamil%5Bwdth%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/cgx-fonts/korean-var.ttf             'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/cgx-fonts/mono-var.ttf             'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansmono/NotoSansMono%5Bwdth%2Cwght%5D.ttf'
          curl -L --fail --retry 3 -o /tmp/cgx-fonts/emoji-var.ttf             'https://raw.githubusercontent.com/google/fonts/main/ofl/notoemoji/NotoEmoji%5Bwght%5D.ttf'

          python -m fontTools.varLib.instancer /tmp/cgx-fonts/sans-var.ttf wght=400 wdth=100 --output=/tmp/cgx-fonts/sans.ttf
          python -m fontTools.varLib.instancer /tmp/cgx-fonts/sinhala-var.ttf wght=400 wdth=100 --output=/tmp/cgx-fonts/sinhala.ttf
          python -m fontTools.varLib.instancer /tmp/cgx-fonts/tamil-var.ttf wght=400 wdth=100 --output=/tmp/cgx-fonts/tamil.ttf
          python -m fontTools.varLib.instancer /tmp/cgx-fonts/korean-var.ttf wght=400 --output=/tmp/cgx-fonts/korean.ttf
          python -m fontTools.varLib.instancer /tmp/cgx-fonts/mono-var.ttf wght=400 wdth=100 --output=/tmp/cgx-fonts/mono.ttf
          python -m fontTools.varLib.instancer /tmp/cgx-fonts/emoji-var.ttf wght=400 --output=/tmp/cgx-fonts/emoji.ttf

          pyftsubset /tmp/cgx-fonts/sans.ttf             --output-file=/tmp/cgx-fonts/NotoSans-Regular.ttf             --unicodes='U+0020-024F,U+0300-036F,U+2000-206F,U+2070-22FF,U+2300-23FF,U+25A0-25FF,U+2600-26FF,U+2700-27BF,U+FE0F'             --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap             --notdef-glyph --notdef-outline --recommended-glyphs

          pyftsubset /tmp/cgx-fonts/sinhala.ttf             --output-file=/tmp/cgx-fonts/NotoSansSinhala-Regular.ttf             --unicodes='U+0D80-0DFF,U+200C-200D,U+25CC'             --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap             --notdef-glyph --notdef-outline --recommended-glyphs

          pyftsubset /tmp/cgx-fonts/tamil.ttf             --output-file=/tmp/cgx-fonts/NotoSansTamil-Regular.ttf             --unicodes='U+0B80-0BFF,U+200C-200D,U+25CC'             --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap             --notdef-glyph --notdef-outline --recommended-glyphs

          pyftsubset /tmp/cgx-fonts/korean.ttf             --output-file=/tmp/cgx-fonts/NotoSansKR-Regular.ttf             --unicodes='U+1100-11FF,U+3130-318F,U+AC00-D7AF,U+3000-303F,U+FF00-FFEF'             --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap             --notdef-glyph --notdef-outline --recommended-glyphs

          pyftsubset /tmp/cgx-fonts/mono.ttf             --output-file=/tmp/cgx-fonts/NotoSansMono-Regular.ttf             --unicodes='U+0020-007E,U+00A0-00FF,U+2000-206F,U+2190-21FF,U+2300-23FF,U+2500-259F,U+25A0-25FF,U+2600-26FF'             --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap             --notdef-glyph --notdef-outline --recommended-glyphs

          pyftsubset /tmp/cgx-fonts/emoji.ttf             --output-file=/tmp/cgx-fonts/NotoEmoji-Regular.ttf             --unicodes='U+2300-23FF,U+2600-27BF,U+1F300-1FAFF,U+FE0F,U+200D'             --layout-features='*' --glyph-names --symbol-cmap --legacy-cmap             --notdef-glyph --notdef-outline --recommended-glyphs

          python - <<'PY'
          import base64, json, pathlib
          fonts = {
              'NotoSans-Regular.ttf': '/tmp/cgx-fonts/NotoSans-Regular.ttf',
              'NotoSansSinhala-Regular.ttf': '/tmp/cgx-fonts/NotoSansSinhala-Regular.ttf',
              'NotoSansTamil-Regular.ttf': '/tmp/cgx-fonts/NotoSansTamil-Regular.ttf',
              'NotoSansKR-Regular.ttf': '/tmp/cgx-fonts/NotoSansKR-Regular.ttf',
              'NotoSansMono-Regular.ttf': '/tmp/cgx-fonts/NotoSansMono-Regular.ttf',
              'NotoEmoji-Regular.ttf': '/tmp/cgx-fonts/NotoEmoji-Regular.ttf',
          }
          encoded = {name: base64.b64encode(pathlib.Path(path).read_bytes()).decode('ascii') for name, path in fonts.items()}
          families = {
              'NotoSans': 'NotoSans-Regular.ttf',
              'NotoSinhala': 'NotoSansSinhala-Regular.ttf',
              'NotoTamil': 'NotoSansTamil-Regular.ttf',
              'NotoKorean': 'NotoSansKR-Regular.ttf',
              'NotoMono': 'NotoSansMono-Regular.ttf',
              'NotoEmoji': 'NotoEmoji-Regular.ttf',
          }
          defs = {
              family: {'normal': file, 'bold': file, 'italics': file, 'bolditalics': file}
              for family, file in families.items()
          }
          js = """(() => {
            'use strict';
            const vfs = %s;
            const fonts = %s;
            globalThis.CGX_PDF_VFS = Object.freeze(vfs);
            globalThis.CGX_PDF_FONTS = Object.freeze(fonts);
            if (globalThis.pdfMake?.addVirtualFileSystem) globalThis.pdfMake.addVirtualFileSystem(vfs);
            if (globalThis.pdfMake?.setFonts) globalThis.pdfMake.setFonts(fonts);
          })();""" % (json.dumps(encoded, separators=(',', ':')), json.dumps(defs, separators=(',', ':')))
          pathlib.Path('vendor/vfs_extra_fonts.js').write_text(js, encoding='utf-8')
          for name, path in fonts.items():
              print(name, pathlib.Path(path).stat().st_size)
          PY

      - name: Commit final font VFS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/vfs_extra_fonts.js
          git commit -m 'chore: finalize self-contained PDF fonts [v039-fonts-final]'
          git push origin HEAD:fix/pdf-selectable-content-v039
