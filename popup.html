<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Thread Exporter</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 440px; min-height: 555px; background: #f7f7f8; color: #202123; }
    header { padding: 18px 18px 13px; background: #fff; border-bottom: 1px solid #e5e5e5; }
    h1 { font-size: 18px; margin: 0 0 5px; }
    .sub { margin: 0; color: #6b6c70; font-size: 12px; line-height: 1.45; }
    main { padding: 14px 16px 18px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    button, select { border: 1px solid #d9d9dc; background: #fff; color: #202123; border-radius: 8px; padding: 8px 11px; cursor: pointer; font-weight: 650; }
    button:hover { background: #f1f1f2; }
    select { padding: 6px 8px; border-radius: 8px; background: #fff; color: #202123; }
    button.primary { background: #17365d; color: #fff; border-color: #10a37f; }
    button.primary:hover { background: #102b4d; }
    button:disabled { cursor: default; opacity: .5; }
    .status { min-height: 18px; font-size: 12px; color: #6b6c70; margin: 8px 0 10px; }
    .error { color: #b42318; }
    .meta { background: #fff; border: 1px solid #e2e2e5; border-radius: 9px; padding: 10px 11px; margin-bottom: 10px; }
    .meta strong { display: block; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .meta span { font-size: 11px; color: #76777a; }
    .select-row { display: flex; justify-content: space-between; align-items: center; margin: 9px 1px; }
    .select-row label { font-size: 12px; color: #55565a; }
    .turns { max-height: 305px; overflow-y: auto; background: #fff; border: 1px solid #e2e2e5; border-radius: 9px; }
    .turn { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px; border-bottom: 1px solid #efeff1; cursor: pointer; }
    .turn:last-child { border-bottom: 0; }
    .turn:hover { background: #fafafa; }
    .turn input { margin-top: 3px; }
    .q { font-size: 12px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
    .a { font-size: 11px; color: #6b6c70; line-height: 1.35; }
    .formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .formats button { min-height: 70px; padding: 9px 7px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
    .format-mark { width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:9px; border:1px solid transparent; }
    .format-mark svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round; }
    .format-pdf { color:#b42318; background:#fff2f0; border-color:#f7c9c5; }
    .format-docx { color:#185abd; background:#edf5ff; border-color:#bfd7fb; }
    .format-md { color:#334155; background:#f1f5f9; border-color:#d6dde6; }
    .format-label { font-size:11px; font-weight:700; }
    footer { font-size: 10px; color: #85868a; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>ChatGPT Thread Exporter</h1>
    <p class="sub">Export the whole conversation or only the Q&amp;A turns you choose. Processing stays in your browser.</p>
  </header>
  <main>
    <div class="toolbar">
      <button id="refresh">Refresh</button>
      <button id="all">Select all</button>
      <button id="none">Clear</button>
    </div>
    <div id="status" class="status">Reading this ChatGPT tab…</div>
    <div id="meta" class="meta" hidden></div>
    <div class="select-row">
      <label><span id="count">0</span> selected Q&amp;A turn(s)</label>
      <label>Page size <select id="page-size" aria-label="Document page size"><option value="A4" selected>A4</option><option value="Letter">Letter</option><option value="Legal">Legal</option></select></label>
    </div>
    <div id="turns" class="turns"></div>
    <div class="formats">
      <button id="md"><span class="format-mark format-md"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.25h13v17.5h-13z"/><path d="M8 9.1v5.8M8 9.1l2.1 2.7 2.1-2.7v5.8M14.1 11.1l1.9 2.25 1.9-2.25M16 13.35V9.1"/></svg></span><span class="format-label">Markdown</span></button>
      <button id="docx"><span class="format-mark format-docx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.1 2.75h7.1l4.25 4.25v14.25H7.1z"/><path d="M14.2 2.75V7h4.25"/><path d="M4.1 9.2h6.9v9.2H4.1z"/><path d="m5.6 11 1.25 5.5 1.2-3.75 1.2 3.75L10.5 11"/></svg></span><span class="format-label">Word</span></button>
      <button id="pdf"><span class="format-mark format-pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.75 2.75h7.2L18.5 7.3v13.95H6.75z"/><path d="M13.95 2.75V7.3h4.55"/><path d="M8.8 14.75h6.4M8.8 17.25h4.7"/></svg></span><span class="format-label">PDF</span></button>
    </div>
    <footer>V0.3.5 · fast paged PDF · local-only</footer>
  </main>
  <script src="math.js"></script>
  <script src="exporter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
